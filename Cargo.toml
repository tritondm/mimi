[package]
name = "rampe"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
authors = ["example.org"]
description = "Rampe – Word-Berichte barrierefrei machen: prüfen, korrigieren, PDF/UA erzeugen"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["multipart"] }
getrandom = "0.4.3"
lopdf = "0.47.0"
quick-xml = "0.37"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
