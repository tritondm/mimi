<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protokoll – Mimi</title>
<script>try { const t = localStorage.getItem('leo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/menu.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.pagetitle { font-size: 1.35rem; margin: 8px 0 4px; }
.lead { margin: 0 0 16px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
button { font: inherit; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
input[type=search], select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; height: 40px; }
input[type=search] { min-width: 260px; }
label { font-weight: 600; display: block; margin-bottom: 4px; font-size: .92rem; }
label.inline { display: inline-flex; gap: 6px; align-items: center; font-weight: normal; margin: 0; }
.muted { color: var(--muted); font-size: .92rem; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
.badge.err { background: var(--err-bg); color: var(--err); }
.filter { display: flex; gap: 12px 16px; flex-wrap: wrap; align-items: end; }
.filter .push { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 150px; }
.stat .n { font-size: 1.5rem; font-weight: 700; display: block; }
.stat .l { color: var(--muted); font-size: .88rem; }
.stat.warn .n { color: var(--err); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; font-size: .92rem; }
th { border-top: 0; color: var(--muted); font-size: .85rem; position: sticky; top: 0; background: var(--card); }
tr.fail td { background: color-mix(in srgb, var(--err-bg) 45%, transparent); }
.nowrap { white-space: nowrap; }
.msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; background: var(--err-bg); color: var(--err); }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64" width="36" height="36" focusable="false"><polyline points="17,46 17,18 32,35 47,18 47,46" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-text"><span class="brand-name">Mimi</span><span class="brand-claim">Macht Inhalte Mühelos Inklusiv</span></span></a>
    <nav class="mainnav hidden" id="mainnav" aria-label="Hauptmenü"></nav>
    <button type="button" class="themebtn" id="themebtn"></button>
    <div class="usermenu hidden" id="usermenu"></div>
  </div>
</header>
<main>
  <h1 class="pagetitle">Protokoll</h1>
  <p class="lead" id="lead">Wer hat wann was getan. Ohne Dateinamen und Inhalte der Berichte.</p>
  <div id="msg" class="msg hidden" role="alert"></div>

  <section class="card hidden" id="noaccess">
    <h2>Kein Zugriff</h2>
    <p>Diese Seite ist nur für Admins. <a href="/">Zur Anmeldung</a></p>
  </section>

  <div id="content" class="hidden">
    <div class="stats" aria-label="Zusammenfassung des gewählten Zeitraums">
      <div class="stat"><span class="n" id="s-all">0</span><span class="l">Ereignisse</span></div>
      <div class="stat"><span class="n" id="s-login">0</span><span class="l">Anmeldungen</span></div>
      <div class="stat warn"><span class="n" id="s-fail">0</span><span class="l">fehlgeschlagen</span></div>
      <div class="stat"><span class="n" id="s-pdf">0</span><span class="l">PDFs erzeugt</span></div>
    </div>

    <section class="card" aria-label="Filter">
      <div class="filter">
        <div><label for="a-q">Suchen</label><input id="a-q" type="search" placeholder="Name, Aktion, IP …"></div>
        <div><label for="a-range">Zeitraum</label>
          <select id="a-range">
            <option value="1">letzte 24 Stunden</option>
            <option value="7" selected>letzte 7 Tage</option>
            <option value="30">letzte 30 Tage</option>
            <option value="0">alles</option>
          </select></div>
        <div><label for="a-action">Aktion</label><select id="a-action"><option value="">alle</option></select></div>
        <label class="inline"><input type="checkbox" id="a-fail"> nur Fehlschläge</label>
        <div class="push"><span class="muted" id="a-count" role="status" aria-live="polite"></span><button id="a-reload">Neu laden</button></div>
      </div>
    </section>

    <section class="card" aria-label="Einträge">
      <div class="scroll">
        <table>
          <thead><tr><th scope="col">Zeit</th><th scope="col">Wer</th><th scope="col">Aktion</th><th scope="col">Betrifft</th><th scope="col">Info</th><th scope="col">IP</th></tr></thead>
          <tbody id="audit"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="/menu.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHOW = 1000;
let entries = [];

function msg(t) { $('#msg').textContent = t; $('#msg').classList.toggle('hidden', !t); }
const isJob = t => /^[0-9a-f]{8}-[0-9a-f-]{27}$/.test(t);

function filtered() {
  const q = $('#a-q').value.trim().toLowerCase(), onlyFail = $('#a-fail').checked;
  const days = +$('#a-range').value, act = $('#a-action').value;
  const since = days ? Date.now() / 1000 - days * 86400 : 0;
  return entries.filter(e => e.ts >= since && (!onlyFail || !e.ok) && (!act || e.action === act)
    && (!q || [e.actor, e.action, e.target, e.detail, e.ip].join(' ').toLowerCase().includes(q)));
}

function render() {
  const rows = filtered();
  // Zahlen für den Zeitraum (ohne Such- und Aktionsfilter)
  const days = +$('#a-range').value, since = days ? Date.now() / 1000 - days * 86400 : 0;
  const inRange = entries.filter(e => e.ts >= since);
  $('#s-all').textContent = inRange.length;
  $('#s-login').textContent = inRange.filter(e => e.action === 'Anmeldung' && e.ok).length;
  $('#s-fail').textContent = inRange.filter(e => !e.ok).length;
  $('#s-pdf').textContent = inRange.filter(e => e.action === 'PDF erzeugt').length;

  $('#audit').innerHTML = rows.slice(0, SHOW).map(e => `<tr${e.ok ? '' : ' class="fail"'}>
    <td class="nowrap">${esc(new Date(e.ts * 1000).toLocaleString('de-AT'))}</td>
    <td>${esc(e.actor)}</td>
    <td>${e.ok ? '' : '<span class="badge err">fehlgeschlagen</span> '}${esc(e.action)}</td>
    <td>${isJob(e.target) ? `<span class="nowrap" title="${esc(e.target)}">Bericht ${esc(e.target.slice(0, 8))}</span>` : esc(e.target)}</td>
    <td>${esc(e.detail)}</td>
    <td class="nowrap">${esc(e.ip)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Keine Einträge für diese Auswahl.</td></tr>';
  $('#a-count').textContent = `${rows.length} Einträge${rows.length > SHOW ? `, die neuesten ${SHOW} angezeigt` : ''}`;
}

async function load() {
  msg('');
  const r = await fetch('/api/admin/audit?limit=20000', {credentials: 'same-origin'});
  if (r.status === 401 || r.status === 403) { $('#content').classList.add('hidden'); $('#noaccess').classList.remove('hidden'); return; }
  const j = await r.json();
  if (!r.ok) { msg(j.error || r.statusText); return; }
  entries = j.entries;
  if (j.days) $('#lead').textContent = `Wer hat wann was getan. Ohne Dateinamen und Inhalte der Berichte. Einträge werden nach ${j.days} Tagen gelöscht.`;
  // Aktionen für die Auswahl
  const sel = $('#a-action'), cur = sel.value;
  const acts = [...new Set(entries.map(e => e.action))].sort((a, b) => a.localeCompare(b, 'de'));
  sel.innerHTML = '<option value="">alle</option>' + acts.map(a => `<option${a === cur ? ' selected' : ''}>${esc(a)}</option>`).join('');
  render();
}

['#a-q', '#a-range', '#a-action', '#a-fail'].forEach(s => $(s).addEventListener(s === '#a-q' ? 'input' : 'change', render));
$('#a-reload').addEventListener('click', load);

(async () => {
  try {
    const r = await fetch('/api/me', {credentials: 'same-origin'});
    if (!r.ok) throw 0;
    const me = await r.json();
    leoMenu.show(me, 'protokoll');
    if (!me.admin) throw 0;
    $('#content').classList.remove('hidden');
    await load();
  } catch (e) { $('#noaccess').classList.remove('hidden'); }
})();
</script>
</body>
</html>
