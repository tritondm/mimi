<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="User management – Mimi">Benutzerverwaltung – Mimi</title>
<script>try { const t = localStorage.getItem('leo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/menu.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
button, .btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
button.secondary, .btn.secondary { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--err); border-color: var(--err); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
input[type=text], input[type=password], input[type=search] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
label { font-weight: 600; display: block; margin-bottom: 4px; }
label.inline { display: inline-flex; gap: 6px; align-items: center; font-weight: normal; }
.muted { color: var(--muted); font-size: .92rem; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .82rem; font-weight: 600; background: var(--info-bg); color: var(--info); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: middle; }
th { border-top: 0; color: var(--muted); font-size: .9rem; }
td.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
form.grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
@media (max-width: 700px) { form.grid { grid-template-columns: 1fr; } }
.pagetitle { font-size: 1.35rem; margin: 8px 0 16px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.err { background: var(--err-bg); color: var(--err); }
.msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
.msg.err { background: var(--err-bg); color: var(--err); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64" width="36" height="36" focusable="false"><polyline points="17,46 17,18 32,35 47,18 47,46" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-text"><span class="brand-name">Mimi</span><span class="brand-claim" data-en="Making Information More Inclusive">Macht Inhalte Mühelos Inklusiv</span></span></a>
    <nav class="mainnav hidden" id="mainnav" aria-label="Hauptmenü" data-en-label="Main menu"></nav>
    <button type="button" class="themebtn langbtn" id="langbtn"></button>
    <button type="button" class="themebtn" id="themebtn"></button>
    <div class="usermenu hidden" id="usermenu"></div>
  </div>
</header>
<main>
  <h1 class="pagetitle" data-en="User management">Benutzerverwaltung</h1>
  <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>

  <section class="card hidden" id="noaccess">
    <h2 data-en="No access">Kein Zugriff</h2>
    <p data-en="This page is for admins only. &lt;a href=&quot;/&quot;&gt;Go to login&lt;/a&gt;">Diese Seite ist nur für Admins. <a href="/">Zur Anmeldung</a></p>
  </section>

  <div id="content" class="hidden">
    <section class="card" aria-labelledby="h-new">
      <h2 id="h-new" data-en="Add user">Benutzer anlegen</h2>
      <form class="grid" id="newform">
        <div><label for="n-name" data-en="User name">Benutzername</label><input id="n-name" type="text" autocomplete="off" required pattern="[A-Za-z0-9._@\-]{1,64}"></div>
        <div><label for="n-pw"><span data-en="Password">Passwort</span> <span class="muted" id="minpw"></span></label><input id="n-pw" type="password" autocomplete="new-password" required></div>
        <div><button type="submit" data-en="Add">Anlegen</button></div>
        <div><label class="inline"><input type="checkbox" id="n-admin"> <span data-en="Admin (may manage users)">Admin (darf Benutzer verwalten)</span></label></div>
      </form>
      <p class="muted" data-en="Letters, digits and . _ - @ are allowed. Please give the password to the person by a secure channel.">Erlaubt sind Buchstaben, Ziffern und . _ - @. Das Passwort teilen Sie der Person bitte auf sicherem Weg mit.</p>
    </section>

    <section class="card" aria-labelledby="h-list">
      <h2 id="h-list" data-en="Users">Benutzer</h2>
      <table>
        <thead><tr><th scope="col">Name</th><th scope="col" data-en="Role">Rolle</th><th scope="col" data-en="Two-factor">Zwei-Faktor</th><th scope="col"><span class="hidden" data-en="Actions">Aktionen</span></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </section>

  </div>
</main>
<script src="/i18n.js"></script>
<script src="/menu.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, minPw = 12;

const pwTooShort = () => L(`Das Passwort muss mindestens ${minPw} Zeichen lang sein.`, `The password must be at least ${minPw} characters long.`);
function msg(text, ok) { const m = $('#msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.classList.toggle('hidden', !text); }

async function api(url, opts = {}) {
  const r = await fetch(url, {credentials: 'same-origin', ...opts});
  const body = (r.headers.get('content-type') || '').includes('json') ? await r.json() : {};
  if (r.status === 401 || r.status === 403) { $('#content').classList.add('hidden'); $('#noaccess').classList.remove('hidden'); throw new Error(body.error || L('Kein Zugriff', 'No access')); }
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
const post = (url, data) => api(url, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(data)});

function render(users) {
  $('#users').innerHTML = users.map(u => {
    const self = u.name === me;
    return `<tr>
      <td>${esc(u.name)}${self ? ` <span class="muted">${L('(Sie)', '(you)')}</span>` : ''}</td>
      <td>${u.admin ? '<span class="badge">Admin</span>' : L('Benutzer', 'User')}</td>
      <td>${u.mfa ? `<span class="badge ok">${L('eingeschaltet', 'on')}</span> <button class="secondary" data-mfa="${esc(u.name)}">${L('Zurücksetzen', 'Reset')}</button>` : `<span class="muted">${L('aus', 'off')}</span>`}</td>
      <td class="actions">
        <button class="secondary" data-pw="${esc(u.name)}">${L('Passwort setzen', 'Set password')}</button>
        ${self ? '' : `<button class="secondary" data-role="${esc(u.name)}" data-admin="${u.admin ? 0 : 1}">${u.admin ? L('Admin-Rechte entziehen', 'Remove admin rights') : L('Zum Admin machen', 'Make admin')}</button>
        <button class="danger" data-del="${esc(u.name)}">${L('Löschen', 'Delete')}</button>`}
      </td></tr>`;
  }).join('');
}

$('#newform').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#n-name').value.trim(), password = $('#n-pw').value;
  if (password.length < minPw) return msg(pwTooShort());
  if (window.__users?.some(u => u.name === name) && !confirm(L(`„${name}“ gibt es schon. Passwort und Rolle überschreiben?`, `“${name}” already exists. Overwrite password and role?`))) return;
  try {
    const r = await post('/api/admin/users', {name, password, admin: $('#n-admin').checked});
    window.__users = r.users; render(r.users); e.target.reset(); msg(L(`Benutzer „${name}“ gespeichert.`, `User “${name}” saved.`), true);
  } catch (err) { msg(err.message); }
});

$('#users').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    let r;
    if (b.dataset.pw) {
      const pw = prompt(L(`Neues Passwort für „${b.dataset.pw}“ (mindestens ${minPw} Zeichen):`, `New password for “${b.dataset.pw}” (at least ${minPw} characters):`));
      if (pw === null) return;
      if (pw.length < minPw) return msg(pwTooShort());
      const u = window.__users.find(x => x.name === b.dataset.pw);
      r = await post('/api/admin/users', {name: b.dataset.pw, password: pw, admin: u.admin});
      msg(L(`Passwort für „${b.dataset.pw}“ geändert. Bestehende Anmeldungen dieses Benutzers wurden beendet.`, `Password for “${b.dataset.pw}” changed. This user's existing sessions were ended.`), true);
    } else if (b.dataset.role) {
      r = await post('/api/admin/users', {name: b.dataset.role, admin: b.dataset.admin === '1'});
      msg(L(`Rolle von „${b.dataset.role}“ geändert.`, `Role of “${b.dataset.role}” changed.`), true);
    } else if (b.dataset.mfa) {
      if (!confirm(L(`Zwei-Faktor-Anmeldung von „${b.dataset.mfa}“ zurücksetzen? Die Person meldet sich danach nur mit Passwort an und kann die App neu einrichten.`,
        `Reset two-factor login of “${b.dataset.mfa}”? The person then logs in with the password only and can set up the app again.`))) return;
      r = await api('/api/admin/users/' + encodeURIComponent(b.dataset.mfa) + '/mfa-reset', {method: 'POST'});
      msg(L(`Zwei-Faktor-Anmeldung von „${b.dataset.mfa}“ zurückgesetzt.`, `Two-factor login of “${b.dataset.mfa}” reset.`), true);
    } else if (b.dataset.del) {
      if (!confirm(L(`Benutzer „${b.dataset.del}“ wirklich löschen?`, `Really delete user “${b.dataset.del}”?`))) return;
      r = await api('/api/admin/users/' + encodeURIComponent(b.dataset.del), {method: 'DELETE'});
      msg(L(`Benutzer „${b.dataset.del}“ gelöscht.`, `User “${b.dataset.del}” deleted.`), true);
    }
    window.__users = r.users; render(r.users);
  } catch (err) { msg(err.message); }
});


(async () => {
  try {
    const r = await fetch('/api/me', {credentials: 'same-origin'});
    if (!r.ok) throw 0;
    const j = await r.json(); me = j.user;
    leoMenu.show(j, 'benutzer');
    if (!j.admin) throw 0;
    const l = await api('/api/admin/users');
    minPw = l.min_password; $('#minpw').textContent = L(`(mind. ${minPw} Zeichen)`, `(at least ${minPw} characters)`);
    window.__users = l.users; render(l.users);
    $('#content').classList.remove('hidden');
  } catch (e) { $('#noaccess').classList.remove('hidden'); }
})();
</script>
</body>
</html>
