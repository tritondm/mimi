<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ablauf in Rampe</title>
  <desc id="d">Sechs Schritte: Hochladen und Korrigieren im Browser; Analysieren, Vorbereiten und Prüfen im Rampe-Server; PDF erzeugen mit LibreOffice, danach richtet Rampe den Strukturbaum. Nach jedem Speichern wird neu analysiert. Am Ende stehen PDF, DOCX und ODT zum Herunterladen bereit.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Rücksprung 3 -> 2 -->
  <path d="M 397 92 C 397 42, 235 42, 235 88" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="316" y="40" font-size="12" fill="#333" text-anchor="middle">nach jedem Speichern neu analysiert</text>

  <!-- Boxen: x = 0,162,324,486,648,810 (Breite 148) -->
  <g font-size="12" fill="#1a1a1a">
    <rect x="4" y="92" width="146" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="77" y="118" font-size="15" font-weight="700" text-anchor="middle">1 Hochladen</text>
    <text x="77" y="142" text-anchor="middle">Word-Datei (.docx)</text>
    <text x="77" y="160" text-anchor="middle">im Browser</text>

    <rect x="166" y="92" width="146" height="96" rx="10" fill="#e5f5e8" stroke="#2f855a" stroke-width="1.5"/>
    <text x="239" y="118" font-size="15" font-weight="700" text-anchor="middle">2 Analysieren</text>
    <text x="239" y="142" text-anchor="middle">Bilder, Tabellen,</text>
    <text x="239" y="160" text-anchor="middle">Links, Ebenen, Farben</text>

    <rect x="328" y="92" width="146" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="401" y="118" font-size="15" font-weight="700" text-anchor="middle">3 Korrigieren</text>
    <text x="401" y="142" text-anchor="middle">Alternativtexte,</text>
    <text x="401" y="160" text-anchor="middle">Häkchen, Speichern</text>

    <rect x="490" y="92" width="146" height="96" rx="10" fill="#e5f5e8" stroke="#2f855a" stroke-width="1.5"/>
    <text x="563" y="118" font-size="15" font-weight="700" text-anchor="middle">4 Vorbereiten</text>
    <text x="563" y="142" text-anchor="middle">Kopie für das PDF:</text>
    <text x="563" y="160" text-anchor="middle">Vorlagen, Felder</text>

    <rect x="652" y="92" width="146" height="96" rx="10" fill="#fdf0e1" stroke="#c05621" stroke-width="1.5"/>
    <text x="725" y="118" font-size="15" font-weight="700" text-anchor="middle">5 PDF erzeugen</text>
    <text x="725" y="142" text-anchor="middle">LibreOffice (PDF/UA),</text>
    <text x="725" y="160" text-anchor="middle">Strukturbaum-Fix</text>

    <rect x="814" y="92" width="142" height="96" rx="10" fill="#e5f5e8" stroke="#2f855a" stroke-width="1.5"/>
    <text x="885" y="118" font-size="15" font-weight="700" text-anchor="middle">6 Prüfen</text>
    <text x="885" y="142" text-anchor="middle">Basisprüfung</text>
    <text x="885" y="160" text-anchor="middle">+ veraPDF</text>
  </g>

  <!-- Pfeile -->
  <g stroke="#555" stroke-width="1.6" marker-end="url(#a)">
    <line x1="150" y1="140" x2="164" y2="140"/>
    <line x1="312" y1="140" x2="326" y2="140"/>
    <line x1="474" y1="140" x2="488" y2="140"/>
    <line x1="636" y1="140" x2="650" y2="140"/>
    <line x1="798" y1="140" x2="812" y2="140"/>
  </g>

  <!-- Ergebnis -->
  <path d="M 885 188 L 885 222" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="694" y="226" width="262" height="54" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="1.2"/>
  <text x="825" y="249" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Herunterladen</text>
  <text x="825" y="268" font-size="12" text-anchor="middle" fill="#1a1a1a">PDF · korrigierte DOCX · ODT</text>

  <!-- Legende -->
  <g font-size="12" fill="#1a1a1a">
    <rect x="4" y="232" width="16" height="16" rx="3" fill="#e3effc" stroke="#2b6cb0"/>
    <text x="28" y="245">Browser (static/index.html)</text>
    <rect x="4" y="256" width="16" height="16" rx="3" fill="#e5f5e8" stroke="#2f855a"/>
    <text x="28" y="269">Rampe-Server (Rust: docx.rs, pdfcheck.rs)</text>
    <rect x="4" y="280" width="16" height="16" rx="3" fill="#fdf0e1" stroke="#c05621"/>
    <text x="28" y="293">LibreOffice (unsichtbar, ohne Oberfläche)</text>
  </g>

  <!-- Ablage -->
  <rect x="4" y="318" width="952" height="70" rx="10" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="20" y="342" font-size="13" font-weight="700" fill="#1a1a1a">Ablage pro Bericht: data/jobs/&lt;id&gt;/</text>
  <text x="20" y="366" font-size="12" fill="#1a1a1a" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">original.docx  current.docx  owner.txt  name.txt  │  prep/ (nur während Export)  │  out/current.pdf  out/current.odt  out/report.json</text>
</svg>
