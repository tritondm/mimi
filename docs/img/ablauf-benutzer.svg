<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">So arbeiten Sie mit Mimi</title>
  <desc id="d">Sechs Schritte: Sie laden die Word-Datei hoch. Mimi sucht Probleme. Sie korrigieren und speichern, danach prüft Mimi neu. Mimi erzeugt das PDF und prüft es; bei Problemen gehen Sie zurück zum Korrigieren. Sie laden PDF und korrigierte Word-Datei herunter und prüfen das PDF abschließend mit PAC.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- Rücksprung 3 -> 2 -->
  <path d="M 397 72 C 397 22, 235 22, 235 68" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="316" y="20" font-size="12" fill="#333" text-anchor="middle">nach jedem Speichern neu geprüft</text>

  <!-- Rücksprung 4 -> 3 -->
  <path d="M 563 168 C 563 214, 401 214, 401 172" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="482" y="226" font-size="12" fill="#333" text-anchor="middle">noch Probleme? zurück und korrigieren</text>

  <!-- Boxen: x = 4,166,328,490,652,814 (Breite 146) -->
  <g font-size="12" fill="#1a1a1a">
    <rect x="4" y="72" width="146" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="77" y="98" font-size="15" font-weight="700" text-anchor="middle">1 Hochladen</text>
    <text x="77" y="122" text-anchor="middle">Word-Datei (.docx)</text>
    <text x="77" y="140" text-anchor="middle">im Browser</text>

    <rect x="166" y="72" width="146" height="96" rx="10" fill="#e5f5e8" stroke="#2f855a" stroke-width="1.5"/>
    <text x="239" y="98" font-size="15" font-weight="700" text-anchor="middle">2 Analysieren</text>
    <text x="239" y="122" text-anchor="middle">findet Probleme bei</text>
    <text x="239" y="140" text-anchor="middle">Bildern, Tabellen …</text>

    <rect x="328" y="72" width="146" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="401" y="98" font-size="15" font-weight="700" text-anchor="middle">3 Korrigieren</text>
    <text x="401" y="122" text-anchor="middle">Alternativtexte,</text>
    <text x="401" y="140" text-anchor="middle">Häkchen, Speichern</text>

    <rect x="490" y="72" width="146" height="96" rx="10" fill="#e5f5e8" stroke="#2f855a" stroke-width="1.5"/>
    <text x="563" y="98" font-size="15" font-weight="700" text-anchor="middle">4 PDF erzeugen</text>
    <text x="563" y="122" text-anchor="middle">barrierefreies PDF</text>
    <text x="563" y="140" text-anchor="middle">erzeugen und prüfen</text>

    <rect x="652" y="72" width="146" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="725" y="98" font-size="15" font-weight="700" text-anchor="middle">5 Herunterladen</text>
    <text x="725" y="122" text-anchor="middle">PDF und korrigierte</text>
    <text x="725" y="140" text-anchor="middle">Word-Datei</text>

    <rect x="814" y="72" width="142" height="96" rx="10" fill="#e3effc" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="885" y="98" font-size="15" font-weight="700" text-anchor="middle">6 PAC</text>
    <text x="885" y="122" text-anchor="middle">abschließend prüfen</text>
    <text x="885" y="140" text-anchor="middle">(Windows)</text>
  </g>

  <!-- Pfeile -->
  <g stroke="#555" stroke-width="1.6" marker-end="url(#a)">
    <line x1="150" y1="120" x2="164" y2="120"/>
    <line x1="312" y1="120" x2="326" y2="120"/>
    <line x1="474" y1="120" x2="488" y2="120"/>
    <line x1="636" y1="120" x2="650" y2="120"/>
    <line x1="798" y1="120" x2="812" y2="120"/>
  </g>

  <!-- Legende -->
  <g font-size="13" fill="#1a1a1a">
    <rect x="4" y="262" width="16" height="16" rx="3" fill="#e3effc" stroke="#2b6cb0"/>
    <text x="28" y="275">Das machen Sie</text>
    <rect x="160" y="262" width="16" height="16" rx="3" fill="#e5f5e8" stroke="#2f855a"/>
    <text x="184" y="275">Das macht Mimi automatisch</text>
  </g>
</svg>
