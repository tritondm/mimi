# Vorlage für nginx vor Mimi. Anpassen:
#   mimi.example.org   eigene Adresse (mehrere Namen mit Leerzeichen getrennt)
#   CONTAINER-IP       Adresse des Containers mit Mimi (lxc list rampe)
# Zertifikat: certbot certonly --nginx --cert-name mimi.example.org -d mimi.example.org [-d weitere.example.org]

upstream rampe {
    server CONTAINER-IP:8080;
}

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name mimi.example.org;
    return 301 https://$host$request_uri;
}

# Optional: frühere Adresse dauerhaft weiterleiten (eigenes Zertifikat, z. B. --cert-name alt.example.org)
# server {
#     listen 80;
#     listen [::]:80;
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name alt.example.org;
#     ssl_certificate     /etc/letsencrypt/live/alt.example.org/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/alt.example.org/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://mimi.example.org$request_uri;
# }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mimi.example.org;
    access_log /var/log/nginx/rampe-access.log;
    error_log /var/log/nginx/rampe-error.log;

    ssl_certificate     /etc/letsencrypt/live/mimi.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimi.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Word-Berichte mit vielen Bildern können groß sein (Mimi erlaubt bis 300 MB)
    client_max_body_size 300m;

    location / {
        proxy_pass http://rampe;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF-Export mit LibreOffice und Prüfung kann dauern
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
