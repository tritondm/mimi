upstream rampe {
    server CONTAINER-IP:8080;
}

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name leo.example.org leo.hblfa-tirol.at;
    return 301 https://$host$request_uri;
}

# alte Adresse -> leo.example.org
server {
    listen 80;
    listen [::]:80;
    server_name rampe.example.org;
    return 301 https://leo.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rampe.example.org;

    ssl_certificate     /etc/letsencrypt/live/rampe.example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rampe.example.org/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://leo.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leo.example.org leo.hblfa-tirol.at;
    access_log /var/log/nginx/rampe-access.log;
    error_log /var/log/nginx/rampe-error.log;

    ssl_certificate     /etc/letsencrypt/live/leo.example.org/fullchain.pem; # managed by Certbot (enthält auch leo.hblfa-tirol.at)
    ssl_certificate_key /etc/letsencrypt/live/leo.example.org/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/bot_protection.conf;

    # Word-Berichte mit vielen Bildern können groß sein (Leo erlaubt bis 300 MB)
    client_max_body_size 300m;

    location / {
        proxy_pass http://rampe;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF-Export mit LibreOffice und Prüfung kann dauern
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
